# Cách dùng:
#   Chạy bản đóng gói (giống production):  docker compose up -d --build   -> http://localhost:8080
#   Chạy chế độ dev (sửa file là thấy ngay): docker compose --profile dev up dev   -> http://localhost:5173
name: web-game

services:
  web:
    build: .
    image: web-game:latest
    container_name: web-game
    ports:
      - "8080:80"
    restart: unless-stopped

  # Dev: mount thẳng mã nguồn, sửa file .js / .css / index.html rồi F5 là thấy, không cần build lại image.
  dev:
    image: nginx:1.27-alpine
    profiles: ["dev"]
    container_name: web-game-dev
    ports:
      - "5173:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./archive:/usr/share/nginx/html/archive:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
