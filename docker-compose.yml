# Cách dùng:
#   Chạy bản đóng gói (giống production):  docker compose up -d --build   -> http://localhost:8080
#   Chạy chế độ dev (sửa file là thấy ngay): docker compose --profile dev up dev   -> http://localhost:5173
name: web-game

services:
  web:
    build: .
    image: web-game:latest
    container_name: web-game
    ports:
      - "8080:80"
    restart: unless-stopped

  # Dev: mount thẳng thư mục public/, sửa index.html rồi F5 là thấy, không cần build lại image.
  dev:
    image: nginx:1.27-alpine
    profiles: ["dev"]
    container_name: web-game-dev
    ports:
      - "5173:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Giai đoạn 2 (multiplayer): thêm service game-server (Node.js + WebSocket) ở đây,
  # tách class Simulation/BotManager trong index.html sang server/ và cho client gửi "cmd" qua WebSocket.
