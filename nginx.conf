server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # HTML, JS, CSS: luôn hỏi lại máy chủ (ETag) để mỗi lần deploy người chơi nhận đúng bộ mô-đun mới
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
